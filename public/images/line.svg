<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="4" preserveAspectRatio="none">
  <defs>
    <!-- 幅16pxごとのパターン。中央に幅12pxの角丸矩形のラインを配置 -->
    <pattern id="dashPattern" patternUnits="userSpaceOnUse" width="16" height="4">
      <rect x="0" y="1" rx="1" ry="1" width="12" height="2" fill="#9ca3af" />
    </pattern>
  </defs>
  <rect width="100%" height="4" fill="url(#dashPattern)" />
</svg>